<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Worksheet Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f3f4f6;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .controls {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            width: 100px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.625rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-generate {
            background: #3b82f6;
            color: white;
        }

        .btn-generate:hover {
            background: #2563eb;
        }

        .btn-print {
            background: #10b981;
            color: white;
        }

        .btn-print:hover {
            background: #059669;
        }

        .info-box {
            background: #eff6ff;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #1e40af;
        }

        /* Worksheet styles */
        .worksheet {
            background: white;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 2rem auto;
            padding: 15mm 15mm;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .worksheet-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #d1d5db;
        }

        .worksheet-title {
            font-size: 26px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .worksheet-subtitle {
            font-size: 18px;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 12px;
        }

        .worksheet-info {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #6b7280;
        }

        .worksheet-info-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .worksheet-info-line {
            border-bottom: 1px solid #d1d5db;
            min-width: 200px;
            display: inline-block;
            padding-bottom: 2px;
        }

        .questions-container {
            column-count: 2;
            column-gap: 25px;
            margin-top: 25px;
        }

        .question-item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            break-inside: avoid;
            page-break-inside: avoid;
            white-space: nowrap;
        }

        .question-number {
            color: #9ca3af;
            font-family: ui-monospace, 'SF Mono', Monaco, 'Cascadia Mono', 'Segoe UI Mono', monospace;
            font-size: 19px;
            min-width: 35px;
            flex-shrink: 0;
        }

        .question-text {
            font-family: ui-monospace, 'SF Mono', Monaco, 'Cascadia Mono', 'Segoe UI Mono', monospace;
            font-size: 19px;
            color: #1f2937;
            flex-shrink: 0;
        }

        .question-answer {
            border-bottom: 1px solid #d1d5db;
            min-width: 85px;
            height: 22px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .question-answer.show-answer {
            border: none;
            color: #059669;
            font-weight: 500;
        }

        .worksheet-footer {
            position: absolute;
            bottom: 15mm;
            left: 0;
            right: 0;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        /* MathML fraction styling */
        math {
            font-family: ui-monospace, 'SF Mono', Monaco, 'Cascadia Mono', 'Segoe UI Mono', monospace;
            font-size: 19px;
        }

        mfrac {
            font-size: 19px;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .controls {
                display: none !important;
            }

            .worksheet {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
                break-after: page;
            }

            @page {
                margin: 0;
                size: A4 portrait;
            }
        }

        @media screen {
            #worksheets {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>Maths Worksheet Generator</h1>

            <div class="input-group">
                <div class="input-field">
                    <label for="worksheetType">Worksheet Type:</label>
                    <select id="worksheetType" style="padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; width: 250px;">
                        <option value="multiply-divide">Multiply & Divide by 10 and 100</option>
                        <option value="decimal-to-fraction">Convert Decimals to Fractions</option>
                        <option value="fraction-to-decimal">Convert Fractions to Decimals</option>
                        <option value="times-tables">Times Tables Practice (up to 12×12)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="input-field">
                    <label for="startPage">Start Page:</label>
                    <input type="number" id="startPage" value="1" min="1" onchange="syncEndPage()">
                </div>

                <div class="input-field">
                    <label for="endPage">End Page:</label>
                    <input type="number" id="endPage" value="1" min="1">
                </div>

                <div class="input-field">
                    <label for="questionsPerSheet">Questions per Sheet:</label>
                    <input type="number" id="questionsPerSheet" value="40" min="10" max="40">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-generate" onclick="generateWorksheets()">
                    Generate Worksheets
                </button>
                <button class="btn-print" onclick="window.print()" id="printBtn" style="display: none;">
                    🖨️ Print
                </button>
            </div>

            <div class="info-box">
                <strong>Note:</strong> Each worksheet number generates the same questions every time.
                Generate pages 1-5 today, and pages 6-10 next week for fresh problems!
            </div>
        </div>

        <div id="worksheets"></div>
    </div>

    <script>
        class SeededRandom {
            constructor(seed) {
                this.seed = seed;
            }

            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
        }

        // Helper function: Generate fraction based on denominator probability distribution
        function generateWeightedFraction(rng) {
            // 95% chance: denominator-based distribution, 5% chance: arbitrary fraction
            if (rng.next() < 0.95) {
                // Denominator pool with weights based on P(d) ∝ 1 / (d^α) where α = 0.7
                const denominators = [2, 4, 5, 10, 20, 25, 50, 100];
                const alpha = 0.7;
                const weights = denominators.map(d => 1 / Math.pow(d, alpha));
                const totalWeight = weights.reduce((a, b) => a + b, 0);

                // Select denominator using weighted random selection
                let rand = rng.next() * totalWeight;
                let selectedDenom = denominators[0];
                for (let i = 0; i < denominators.length; i++) {
                    rand -= weights[i];
                    if (rand <= 0) {
                        selectedDenom = denominators[i];
                        break;
                    }
                }

                // Pick a random numerator that's coprime to denominator (to get non-redundant fractions)
                const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                let numerator;
                let attempts = 0;
                do {
                    numerator = Math.floor(rng.next() * selectedDenom);
                    attempts++;
                } while ((numerator === 0 || gcd(numerator, selectedDenom) !== 1) && attempts < 100);

                if (numerator === 0) numerator = 1;

                return { numerator, denominator: selectedDenom };
            } else {
                // 5% chance: arbitrary fraction up to 100
                const denominator = Math.floor(rng.next() * 99) + 2; // 2-100
                const numerator = Math.floor(rng.next() * denominator);
                return { numerator: numerator === 0 ? 1 : numerator, denominator };
            }
        }

        // Helper function to create MathML fraction
        function createMathMLFraction(wholePart, numerator, denominator) {
            if (wholePart > 0) {
                // Mixed number: whole + fraction
                return `<math xmlns="http://www.w3.org/1998/Math/MathML">
                    <mn>${wholePart}</mn>
                    <mfrac>
                        <mn>${numerator}</mn>
                        <mn>${denominator}</mn>
                    </mfrac>
                </math>`;
            } else {
                // Just fraction
                return `<math xmlns="http://www.w3.org/1998/Math/MathML">
                    <mfrac>
                        <mn>${numerator}</mn>
                        <mn>${denominator}</mn>
                    </mfrac>
                </math>`;
            }
        }

        // Question type generators - modular design for easy extension
        const questionGenerators = {
            'multiply-divide': {
                title: 'Multiply & Divide by 10 and 100',
                generate: function(rng) {
                    const num = (rng.next() * 999 + 0.01) * (rng.next() < 0.3 ? -1 : 1);
                    const roundedNum = Math.round(num * 100) / 100;

                    const operations = [
                        { text: '× 10 ', calc: (n) => n * 10 },
                        { text: '× 100', calc: (n) => n * 100 },
                        { text: '÷ 10 ', calc: (n) => n / 10 },
                        { text: '÷ 100', calc: (n) => n / 100 }
                    ];
                    const op = operations[Math.floor(rng.next() * operations.length)];

                    let attempts = 0;
                    let finalNum = roundedNum;
                    let answer = op.calc(finalNum);

                    while ((Math.abs(answer) > 999 || Math.abs(answer) < 0.01) && attempts < 100) {
                        const newNum = (rng.next() * 999 + 0.01) * (rng.next() < 0.3 ? -1 : 1);
                        finalNum = Math.round(newNum * 100) / 100;
                        answer = op.calc(finalNum);
                        attempts++;
                    }

                    return {
                        question: `${finalNum.toFixed(2).padStart(7, " ")} ${op.text} =`,
                        answer: Math.round(answer * 100) / 100
                    };
                }
            },

            'decimal-to-fraction': {
                title: 'Convert Decimals to Fractions',
                generate: function(rng) {
                    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

                    // Generate fraction using weighted distribution
                    const frac = generateWeightedFraction(rng);
                    const decimal = frac.numerator / frac.denominator;

                    // Simplify and format answer
                    const divisor = gcd(frac.numerator, frac.denominator);
                    const simplifiedNum = frac.numerator / divisor;
                    const simplifiedDenom = frac.denominator / divisor;

                    // Add whole number part (0-99)
                    const wholePart = Math.floor(rng.next() * 100);
                    const finalDecimal = wholePart + decimal;

                    // Format decimal: remove trailing zero if present, replace with space for alignment
                    let decimalStr = finalDecimal.toFixed(2);
                    if (decimalStr.endsWith('0') && decimalStr.includes('.')) {
                        decimalStr = decimalStr.slice(0, -1) + ' ';
                    }

                    let answer = `${simplifiedNum}/${simplifiedDenom}`;
                    if (wholePart > 0) {
                        answer = `${wholePart} ${answer}`;
                    }

                    return {
                        question: decimalStr,
                        answer: answer
                    };
                }
            },

            'fraction-to-decimal': {
                title: 'Convert Fractions to Decimals',
                generate: function(rng) {
                    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

                    // Generate fraction using weighted distribution
                    const frac = generateWeightedFraction(rng);
                    const decimal = frac.numerator / frac.denominator;

                    // Simplify fraction for display
                    const divisor = gcd(frac.numerator, frac.denominator);
                    const simplifiedNum = frac.numerator / divisor;
                    const simplifiedDenom = frac.denominator / divisor;

                    // Add whole number part (0-99)
                    const wholePart = Math.floor(rng.next() * 100);
                    const finalDecimal = wholePart + decimal;

                    return {
                        question: createMathMLFraction(wholePart, simplifiedNum, simplifiedDenom),
                        answer: finalDecimal.toFixed(2),
                        isMathML: true
                    };
                }
            },

            'times-tables': {
                title: 'Times Tables Practice (up to 12×12)',
                generate: function(rng) {
                    // Weighted distribution for multiplication tables
                    // Tier 1 (15%): Easy - 1, 2, 10, 11
                    // Tier 2 (25%): Moderate - 3, 4, 5
                    // Tier 3 (45%): Challenging - 6, 7, 8, 9
                    // Tier 4 (15%): Advanced - 12

                    const tiers = [
                        { numbers: [1, 2, 10, 11], weight: 0.15 },
                        { numbers: [3, 4, 5], weight: 0.25 },
                        { numbers: [6, 7, 8, 9], weight: 0.45 },
                        { numbers: [12], weight: 0.15 }
                    ];

                    // Select tier based on weights
                    let rand = rng.next();
                    let selectedTier = tiers[0];
                    let cumulative = 0;
                    for (const tier of tiers) {
                        cumulative += tier.weight;
                        if (rand < cumulative) {
                            selectedTier = tier;
                            break;
                        }
                    }

                    // Pick a random number from the selected tier for first operand
                    const num1 = selectedTier.numbers[Math.floor(rng.next() * selectedTier.numbers.length)];

                    // Pick a second number from 1-12 (uniform distribution)
                    const num2 = Math.floor(rng.next() * 12) + 1;

                    // Randomly swap order so the weighted number isn't always first
                    const [a, b] = rng.next() < 0.5 ? [num1, num2] : [num2, num1];

                    return {
                        question: `${a} × ${b} =`,
                        answer: a * b
                    };
                }
            }
        };

        function createWorksheet(worksheetId, questions, isAnswerKey, title) {
            const worksheet = document.createElement('div');
            worksheet.className = 'worksheet';

            // Header
            const header = document.createElement('div');
            header.className = 'worksheet-header';

            const titleElem = document.createElement('div');
            titleElem.className = 'worksheet-title';
            titleElem.textContent = title;

            const subtitle = document.createElement('div');
            subtitle.className = 'worksheet-subtitle';
            subtitle.textContent = isAnswerKey ? `Worksheet ${worksheetId} - Answer Key` : `Worksheet ${worksheetId}`;

            header.appendChild(titleElem);
            header.appendChild(subtitle);

            if (!isAnswerKey) {
                const info = document.createElement('div');
                info.className = 'worksheet-info';

                const nameItem = document.createElement('div');
                nameItem.className = 'worksheet-info-item';
                nameItem.innerHTML = 'Name: <span class="worksheet-info-line"></span>';

                const dateItem = document.createElement('div');
                dateItem.className = 'worksheet-info-item';
                dateItem.innerHTML = 'Date: <span class="worksheet-info-line"></span>';

                info.appendChild(nameItem);
                info.appendChild(dateItem);
                header.appendChild(info);
            }

            worksheet.appendChild(header);

            // Questions
            const questionsContainer = document.createElement('div');
            questionsContainer.className = 'questions-container';

            questions.forEach((q, idx) => {
                const questionItem = document.createElement('div');
                questionItem.className = 'question-item';

                const questionNumber = document.createElement('div');
                questionNumber.className = 'question-number';
                questionNumber.textContent = `${idx + 1}.`;

                const questionText = document.createElement('div');
                questionText.className = 'question-text';

                if (q.isMathML) {
                    questionText.innerHTML = q.question;
                } else {
                    questionText.textContent = q.question;
                }

                const answerSpace = document.createElement('div');
                answerSpace.className = 'question-answer';
                if (isAnswerKey) {
                    answerSpace.classList.add('show-answer');
                    answerSpace.textContent = q.answer.toString();
                }

                questionItem.appendChild(questionNumber);
                questionItem.appendChild(questionText);
                questionItem.appendChild(answerSpace);

                questionsContainer.appendChild(questionItem);
            });

            worksheet.appendChild(questionsContainer);

            // Footer
            if (!isAnswerKey) {
                const footer = document.createElement('div');
                footer.className = 'worksheet-footer';
                footer.textContent = `Page ${worksheetId}`;
                worksheet.appendChild(footer);
            }

            return worksheet;
        }

        function generateWorksheets() {
            const worksheetType = document.getElementById('worksheetType').value;
            const startPage = parseInt(document.getElementById('startPage').value) || 1;
            const endPage = parseInt(document.getElementById('endPage').value) || 1;
            const questionsPerSheet = parseInt(document.getElementById('questionsPerSheet').value) || 40;

            const generator = questionGenerators[worksheetType];
            if (!generator) {
                alert('Invalid worksheet type selected');
                return;
            }

            const container = document.getElementById('worksheets');
            container.innerHTML = '';

            for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                const rng = new SeededRandom(pageNum * 12345);
                const questions = [];

                for (let j = 0; j < questionsPerSheet; j++) {
                    questions.push(generator.generate(rng));
                }

                // Create worksheet
                const worksheet = createWorksheet(pageNum, questions, false, generator.title);
                container.appendChild(worksheet);

                // Create answer key (commented out by default)
                // const answerKey = createWorksheet(pageNum, questions, true, generator.title);
                // container.appendChild(answerKey);
            }

            document.getElementById('printBtn').style.display = 'flex';
        }

        function syncEndPage() {
            const startPage = parseInt(document.getElementById('startPage').value) || 1;
            const endPage = parseInt(document.getElementById('endPage').value) || 1;

            if (startPage > endPage) {
                document.getElementById('endPage').value = startPage;
            }
        }

        // Generate first worksheet on load
        window.addEventListener('load', () => {
            generateWorksheets();
        });
    </script>
</body>
</html>
