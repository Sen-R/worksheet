<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Worksheet Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f3f4f6;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .controls {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            width: 100px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.625rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-generate {
            background: #3b82f6;
            color: white;
        }

        .btn-generate:hover {
            background: #2563eb;
        }

        .btn-print {
            background: #10b981;
            color: white;
        }

        .btn-print:hover {
            background: #059669;
        }

        .btn-pdf {
            background: #8b5cf6;
            color: white;
        }

        .btn-pdf:hover {
            background: #7c3aed;
        }

        .info-box {
            background: #eff6ff;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #1e40af;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        canvas {
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .controls {
                display: none;
            }
            .canvas-container {
                margin: 0;
                page-break-after: always;
            }
            canvas {
                width: 210mm !important;
                height: 297mm !important;
                max-width: 100%;
                border: none;
                box-shadow: none;
            }
            @page {
                margin: 0;
                size: A4 portrait;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>Maths Worksheet Generator</h1>
            
            <div class="input-group">
                <div class="input-field">
                    <label for="worksheetType">Worksheet Type:</label>
                    <select id="worksheetType" style="padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; width: 250px;">
                        <option value="multiply-divide">Multiply & Divide by 10 and 100</option>
                        <option value="decimal-to-fraction">Convert Decimals to Fractions</option>
                        <option value="fraction-to-decimal">Convert Fractions to Decimals</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div class="input-field">
                    <label for="startPage">Start Page:</label>
                    <input type="number" id="startPage" value="1" min="1">
                </div>

                <div class="input-field">
                    <label for="endPage">End Page:</label>
                    <input type="number" id="endPage" value="1" min="1">
                </div>

                <div class="input-field">
                    <label for="questionsPerSheet">Questions per Sheet:</label>
                    <input type="number" id="questionsPerSheet" value="40" min="10" max="40">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-generate" onclick="generateWorksheets()">
                    Generate Worksheets
                </button>
                <button class="btn-print" onclick="window.print()" id="printBtn" style="display: none;">
                    🖨️ Print
                </button>
                <button class="btn-pdf" onclick="savePDF()" id="pdfBtn" style="display: none;">
                    📄 Save as PDF
                </button>
            </div>
            
            <div class="info-box">
                <strong>Note:</strong> Each worksheet number generates the same questions every time. 
                Generate pages 1-5 today, and pages 6-10 next week for fresh problems!
            </div>
        </div>
        
        <div id="worksheets"></div>
    </div>

    <script>
        class SeededRandom {
            constructor(seed) {
                this.seed = seed;
            }
            
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
        }

        // Helper function: Generate fraction based on denominator probability distribution
        function generateWeightedFraction(rng) {
            // 95% chance: denominator-based distribution, 5% chance: arbitrary fraction
            if (rng.next() < 0.95) {
                // Denominator pool with weights based on P(d) ∝ 1 / (d^α) where α = 0.7
                const denominators = [2, 4, 5, 10, 20, 25, 50, 100];
                const alpha = 0.7;
                const weights = denominators.map(d => 1 / Math.pow(d, alpha));
                const totalWeight = weights.reduce((a, b) => a + b, 0);

                // Select denominator using weighted random selection
                let rand = rng.next() * totalWeight;
                let selectedDenom = denominators[0];
                for (let i = 0; i < denominators.length; i++) {
                    rand -= weights[i];
                    if (rand <= 0) {
                        selectedDenom = denominators[i];
                        break;
                    }
                }

                // Pick a random numerator that's coprime to denominator (to get non-redundant fractions)
                const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                let numerator;
                let attempts = 0;
                do {
                    numerator = Math.floor(rng.next() * selectedDenom);
                    attempts++;
                } while ((numerator === 0 || gcd(numerator, selectedDenom) !== 1) && attempts < 100);

                if (numerator === 0) numerator = 1;

                return { numerator, denominator: selectedDenom };
            } else {
                // 5% chance: arbitrary fraction up to 100
                const denominator = Math.floor(rng.next() * 99) + 2; // 2-100
                const numerator = Math.floor(rng.next() * denominator);
                return { numerator: numerator === 0 ? 1 : numerator, denominator };
            }
        }

        // Question type generators - modular design for easy extension
        const questionGenerators = {
            'multiply-divide': {
                title: 'Multiply & Divide by 10 and 100',
                generate: function(rng) {
                    const num = (rng.next() * 999 + 0.01) * (rng.next() < 0.3 ? -1 : 1);
                    const roundedNum = Math.round(num * 100) / 100;

                    const operations = [
                        { text: '× 10 ', calc: (n) => n * 10 },
                        { text: '× 100', calc: (n) => n * 100 },
                        { text: '÷ 10 ', calc: (n) => n / 10 },
                        { text: '÷ 100', calc: (n) => n / 100 }
                    ];
                    const op = operations[Math.floor(rng.next() * operations.length)];

                    let attempts = 0;
                    let finalNum = roundedNum;
                    let answer = op.calc(finalNum);

                    while ((Math.abs(answer) > 999 || Math.abs(answer) < 0.01) && attempts < 100) {
                        const newNum = (rng.next() * 999 + 0.01) * (rng.next() < 0.3 ? -1 : 1);
                        finalNum = Math.round(newNum * 100) / 100;
                        answer = op.calc(finalNum);
                        attempts++;
                    }

                    return {
                        question: `${finalNum.toFixed(2).padStart(7, " ")} ${op.text} =`,
                        answer: Math.round(answer * 100) / 100
                    };
                }
            },

            'decimal-to-fraction': {
                title: 'Convert Decimals to Fractions',
                generate: function(rng) {
                    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

                    // Generate fraction using weighted distribution
                    const frac = generateWeightedFraction(rng);
                    const decimal = frac.numerator / frac.denominator;

                    // Simplify and format answer
                    const divisor = gcd(frac.numerator, frac.denominator);
                    const simplifiedNum = frac.numerator / divisor;
                    const simplifiedDenom = frac.denominator / divisor;

                    // Add whole number part (0-99)
                    const wholePart = Math.floor(rng.next() * 100);
                    const finalDecimal = wholePart + decimal;

                    // Format decimal: remove trailing zero if present, replace with space for alignment
                    let decimalStr = finalDecimal.toFixed(2);
                    if (decimalStr.endsWith('0') && decimalStr.includes('.')) {
                        decimalStr = decimalStr.slice(0, -1) + ' ';
                    }

                    let answer = `${simplifiedNum}/${simplifiedDenom}`;
                    if (wholePart > 0) {
                        answer = `${wholePart} ${answer}`;
                    }

                    return {
                        question: decimalStr,
                        answer: answer
                    };
                }
            },

            'fraction-to-decimal': {
                title: 'Convert Fractions to Decimals',
                generate: function(rng) {
                    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

                    // Generate fraction using weighted distribution
                    const frac = generateWeightedFraction(rng);
                    const decimal = frac.numerator / frac.denominator;

                    // Simplify fraction for display
                    const divisor = gcd(frac.numerator, frac.denominator);
                    const simplifiedNum = frac.numerator / divisor;
                    const simplifiedDenom = frac.denominator / divisor;

                    // Add whole number part (0-99)
                    const wholePart = Math.floor(rng.next() * 100);
                    const finalDecimal = wholePart + decimal;

                    let question = `${simplifiedNum}/${simplifiedDenom}`;
                    if (wholePart > 0) {
                        question = `${wholePart} ${question}`;
                    }

                    return {
                        question: question,
                        answer: finalDecimal.toFixed(2)
                    };
                }
            }
        };

        function drawWorksheet(canvas, worksheetId, questions, isAnswerKey, title) {
            const ctx = canvas.getContext('2d');
            const dpi = 2;
            const width = 816;
            const height = 1056;

            canvas.width = width * dpi;
            canvas.height = height * dpi;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.scale(dpi, dpi);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);

            // Header with modern font
            ctx.fillStyle = '#1f2937';
            ctx.font = '700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillText(title, 60, 50);

            ctx.font = '500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.fillStyle = '#4b5563';
            ctx.fillText(isAnswerKey ? `Worksheet ${worksheetId} - Answer Key` : `Worksheet ${worksheetId}`, 60, 78);

            if (!isAnswerKey) {
                ctx.font = '400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillStyle = '#6b7280';
                ctx.fillText('Name: ___________________________', 60, 108);
                ctx.fillText('Date: ___________________________', 420, 108);
            }

            // Header line
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(60, 125);
            ctx.lineTo(756, 125);
            ctx.stroke();

            // Questions with better spacing
            const startY = 160;
            const colWidth = 360;
            const rowHeight = 38;
            const questionsPerCol = Math.ceil(questions.length / 2);

            ctx.font = '400 19px ui-monospace, "SF Mono", Monaco, "Cascadia Mono", "Segoe UI Mono", monospace';

            questions.forEach((q, idx) => {
                const col = Math.floor(idx / questionsPerCol);
                const row = idx % questionsPerCol;
                const x = 60 + col * colWidth;
                const y = startY + row * rowHeight;

                // Question number
                ctx.fillStyle = '#9ca3af';
                ctx.fillText(`${idx + 1}.`, x, y);

                // Question text with proper spacing
                ctx.fillStyle = '#1f2937';
                ctx.fillText(q.question, x + 40, y);

                if (isAnswerKey) {
                    ctx.fillStyle = '#059669';
                    ctx.fillText(q.answer.toString(), x + 240, y);
                } else {
                    // Answer line
                    ctx.strokeStyle = '#d1d5db';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x + 240, y + 5);
                    ctx.lineTo(x + 340, y + 5);
                    ctx.stroke();
                }
            });

            // Footer
            if (!isAnswerKey) {
                ctx.fillStyle = '#9ca3af';
                ctx.font = '400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(`Page ${worksheetId}`, width / 2 - 20, height - 30);
            }
        }

        function generateWorksheets() {
            const worksheetType = document.getElementById('worksheetType').value;
            const startPage = parseInt(document.getElementById('startPage').value) || 1;
            const endPage = parseInt(document.getElementById('endPage').value) || 1;
            const questionsPerSheet = parseInt(document.getElementById('questionsPerSheet').value) || 40;

            const generator = questionGenerators[worksheetType];
            if (!generator) {
                alert('Invalid worksheet type selected');
                return;
            }

            const container = document.getElementById('worksheets');
            container.innerHTML = '';

            for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                const rng = new SeededRandom(pageNum * 12345);
                const questions = [];

                for (let j = 0; j < questionsPerSheet; j++) {
                    questions.push(generator.generate(rng));
                }

                // Create worksheet canvas
                const worksheetDiv = document.createElement('div');
                worksheetDiv.className = 'canvas-container';
                const worksheetCanvas = document.createElement('canvas');
                worksheetDiv.appendChild(worksheetCanvas);
                container.appendChild(worksheetDiv);
                drawWorksheet(worksheetCanvas, pageNum, questions, false, generator.title);

                // Create answer key canvas
                // const answerDiv = document.createElement('div');
                // answerDiv.className = 'canvas-container';
                // const answerCanvas = document.createElement('canvas');
                // answerDiv.appendChild(answerCanvas);
                // container.appendChild(answerDiv);
                // drawWorksheet(answerCanvas, pageNum, questions, true, generator.title);
            }

            document.getElementById('printBtn').style.display = 'flex';
            document.getElementById('pdfBtn').style.display = 'flex';
        }

        function savePDF() {
            alert('To save as PDF: Click the Print button, then select "Save as PDF" as your printer destination.');
        }

        // Generate first worksheet on load
        window.addEventListener('load', () => {
            generateWorksheets();
        });
    </script>
</body>
</html>
